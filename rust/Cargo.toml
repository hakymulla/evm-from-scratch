[package]
name = "evm"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hex = "0.4.3"
keccak-hash = "0.12.0"
lazy_static = "1.5.0"
primitive-types = "0.12.0"
serde = { version = "1.0.145", features = ["derive"] }
serde_json = "1.0.86"
thiserror = "1"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Ethereum / Base RPC
alloy = { version = "1", features = [
    "providers",
    "provider-http",
    "provider-ws",
    "rpc-types",
    "network",
    "transports",
    "transport-http",
    "transport-ws",
] }

# HTTP client (CoinGecko price fetch)
reqwest = { version = "0.12", features = ["json"] }

# Serialization
# serde = { version = "1.0.214", features = ["derive"] }  # older compatible version
# serde_json = "1"

# Utilities
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3.32"
